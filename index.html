<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#fdf6e8; --sky-1:#1b1130; --sky-2:#3a1a5e; --sky-3:#5a2a7d;
    --gold:#e8b84b; --gold-2:#f4d989;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; font-family:'Poppins',Arial,sans-serif;
    background:radial-gradient(ellipse at 50% -10%, var(--sky-3), var(--sky-2) 45%, var(--sky-1) 100%);
    color:var(--ink); overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  .stage{
    width:100%; max-width:420px; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px; gap:20px; position:relative; z-index:1;
  }

  #tapBtn{
    all:unset; cursor:pointer; font-size:110px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    width:200px; height:200px; border-radius:28px;
    transition:transform 1.1s cubic-bezier(.2,.8,.2,1);
  }
  #tapBtn:active{transform:scale(.94);}
  #tapBtn.bump{animation:bump 1.4s cubic-bezier(.2,.8,.2,1);}
  @keyframes bump{
    0%{transform:scale(1) rotate(0deg);}
    45%{transform:scale(1.15) rotate(-4deg);}
    100%{transform:scale(1) rotate(0deg);}
  }

  #hint{font-size:15px; color:var(--gold-2); opacity:.9; text-align:center; transition:opacity 1.2s ease;}

  .card{
    display:none; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:22px; padding:10px; opacity:0; transition:opacity 1.8s ease;
  }
  .card.show{display:flex;}
  .card.visible{opacity:1;}
  .card h1{font-size:clamp(26px,7vw,38px); margin:0 0 4px; font-weight:800; color:var(--gold-2);}
  #prizeBtn{
    font-family:inherit; font-size:16px; font-weight:700;
    color:var(--sky-1); background:var(--gold-2);
    border:none; border-radius:999px; padding:14px 28px; cursor:pointer;
    box-shadow:0 6px 16px rgba(232,184,75,.35);
    transition:transform .3s ease;
  }
  #prizeBtn:active{transform:scale(.96);}

  .flash{position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:20;}
  .flash.go{animation:flashAnim 3.2s ease forwards;}
  @keyframes flashAnim{0%{opacity:0;}22%{opacity:1;}100%{opacity:0;}}

  .prize{
    display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; text-align:center; padding:10px; opacity:0; transition:opacity 1.8s ease 1.4s;
  }
  .prize.show{display:flex;}
  .prize.visible{opacity:1;}
  #pineapple{font-size:100px; display:inline-block;}
  .prize p{font-size:18px; color:var(--gold-2); font-weight:700; margin:0;}

  .confetti{position:fixed; inset:0; pointer-events:none; z-index:15; overflow:hidden;}
  .confetti span{position:absolute; top:-5%; font-size:18px; animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(115vh) rotate(400deg); opacity:.9;}}

  @media (prefers-reduced-motion: reduce){
    #tapBtn,.confetti span{animation:none !important;}
  }
</style>
</head>
<body>

<div class="stage">
  <button id="tapBtn" aria-label="Open the envelope">✉️</button>
  <div id="hint">Tap to open the letter</div>

  <div class="card" id="card">
    <h1>Happy 18th Birthday!</h1>
    <button id="prizeBtn">Tap to show your prize</button>
  </div>

  <div class="prize" id="prize">
    <div id="pineapple">🍍</div>
    <p>There it is 🍍</p>
  </div>
</div>

<div class="flash" id="flash"></div>
<div class="confetti" id="confetti"></div>

<script>
  var tapBtn = document.getElementById('tapBtn');
  var hint = document.getElementById('hint');
  var card = document.getElementById('card');
  var stages = ['✉️', '📩', '📨', '💌'];
  var taps = 0;

  function onTap() {
    if (taps >= 3) return;
    taps = taps + 1;
    tapBtn.textContent = stages[taps];
    tapBtn.classList.remove('bump');
    tapBtn.offsetWidth; /* restart animation */
    tapBtn.classList.add('bump');

    if (taps === 1) {
      hint.style.opacity = '0';
    }

    if (taps >= 3) {
      setTimeout(function () {
        tapBtn.style.transition = 'opacity 1.4s ease, transform 1.4s ease';
        tapBtn.style.opacity = '0';
        tapBtn.style.transform = 'scale(.8)';
        setTimeout(function () {
          tapBtn.style.display = 'none';
          card.classList.add('show');
          requestAnimationFrame(function () {
            card.classList.add('visible');
          });
        }, 1400);
      }, 900);
    }
  }

  tapBtn.onclick = onTap;

  var prizeBtn = document.getElementById('prizeBtn');
  var flash = document.getElementById('flash');
  var prize = document.getElementById('prize');
  var confettiWrap = document.getElementById('confetti');
  var bits = ['🎉', '✨', '🎈', '⭐', '🍍'];
  var fired = false;

  function onPrize() {
    if (fired) return;
    fired = true;
    prizeBtn.disabled = true;
    card.style.transition = 'opacity 1.2s ease';
    card.style.opacity = '0';
    setTimeout(function () { card.style.display = 'none'; }, 1200);
    flash.classList.add('go');

    for (var i = 0; i < 22; i++) {
      var c = document.createElement('span');
      c.textContent = bits[Math.floor(Math.random() * bits.length)];
      c.style.left = Math.random() * 100 + '%';
      c.style.animationDuration = (4.5 + Math.random() * 2.5) + 's';
      c.style.animationDelay = (Math.random() * 1.2) + 's';
      confettiWrap.appendChild(c);
      (function (el) { setTimeout(function () { el.remove(); }, 8000); })(c);
    }

    setTimeout(function () {
      prize.classList.add('show');
      requestAnimationFrame(function () {
        prize.classList.add('visible');
      });
    }, 1600);
  }

  prizeBtn.onclick = onPrize;
</script>
</body>
</html>
